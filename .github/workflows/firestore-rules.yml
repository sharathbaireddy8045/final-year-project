name: Publish Firestore rules

# Deploys firestore.rules to the bliss-and-blooms project whenever the rules
# change on main (or when started manually from the Actions tab).
#
# One-time setup:
#   1. Firebase Console -> Project settings -> Service accounts
#      -> Generate new private key (downloads a JSON file).
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions
#      -> New repository secret.
#      Name:  FIREBASE_SERVICE_ACCOUNT
#      Value: the entire JSON file contents.
#   3. Actions tab -> "Publish Firestore rules" -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firestore.rules

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Firebase service account secret
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret before running this workflow."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy firestore.rules
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project bliss-and-blooms --non-interactive
