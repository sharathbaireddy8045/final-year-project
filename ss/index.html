<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Bliss Bloom Events - Login</title>
    <script src="theme.js?v=3"></script>
    <script src="firebase-config.js?v=2"></script>
    <script type="module" src="auth.js?v=2"></script>
    <style>
        :root {
            --accent: #e8c96a;
            --accent-rgb: 232, 201, 106;
            --page-bg: #0b0a07;
            --panel: #15130e;
            --panel-2: #1c1912;
            --panel-border: #2f2a1f;
            --text: #f5f1e6;
            --muted: #9c9583;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            min-height: 100vh;
            padding: 36px 16px;
            background-color: var(--page-bg);
            background-image:
                radial-gradient(circle at 50% -6%, rgba(var(--accent-rgb), 0.20), transparent 44%),
                radial-gradient(circle at 88% 104%, rgba(var(--accent-rgb), 0.09), transparent 40%),
                radial-gradient(circle at 6% 20%, rgba(var(--accent-rgb), 0.05), transparent 34%);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        }

        .auth-shell {
            width: 100%;
            min-height: calc(100vh - 72px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ---------- Brand ---------- */
        .auth-brand {
            position: relative;
            margin-bottom: 30px;
            text-align: center;
        }

        .auth-logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(var(--accent-rgb), 0.55);
            border-radius: 50%;
            background: radial-gradient(circle at 50% 28%, rgba(var(--accent-rgb), 0.18), rgba(var(--accent-rgb), 0.02) 72%);
            box-shadow:
                0 0 0 6px rgba(var(--accent-rgb), 0.05),
                0 0 48px rgba(var(--accent-rgb), 0.30),
                inset 0 0 24px rgba(var(--accent-rgb), 0.12);
        }

        .auth-logo img {
            width: 52px;
            height: 52px;
            display: block;
            filter: drop-shadow(0 0 14px rgba(var(--accent-rgb), 0.55));
        }

        .auth-wordmark {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(1.35rem, 4.9vw, 1.95rem);
            font-weight: 700;
            letter-spacing: 0.18em;
            line-height: 1.2;
            text-transform: uppercase;
            white-space: nowrap;
            background: linear-gradient(100deg, #f8e9bb 0%, #e8c96a 30%, #b8912f 52%, #f3dfa0 76%, #caa64c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 16px rgba(var(--accent-rgb), 0.30));
        }

        .auth-wordmark span {
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }

        .auth-tagline {
            margin-top: 11px;
            color: #b3a888;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        .auth-brand::after {
            content: "";
            display: block;
            width: 128px;
            height: 1px;
            margin: 16px auto 0;
            background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.75), transparent);
        }

        /* ---------- Card ---------- */
        .auth-card {
            width: min(440px, 100%);
            padding: 30px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 42%), var(--panel);
            border: 1px solid rgba(var(--accent-rgb), 0.16);
            border-radius: 28px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.58),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .auth-view {
            display: none;
        }

        .auth-view.active {
            display: block;
            animation: viewIn 0.3s ease-out both;
        }

        @keyframes viewIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Sign-in options ---------- */
        .auth-option {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            margin-bottom: 12px;
            padding: 15px 18px;
            background: var(--panel-2);
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-option svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .auth-option:hover {
            transform: translateY(-1px);
            border-color: rgba(var(--accent-rgb), 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .auth-option.google {
            background: #ffffff;
            border-color: #ffffff;
            color: #111111;
        }

        .auth-option.google:hover {
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.16);
        }

        .auth-option.apple {
            background: #1b1b1e;
            border-color: #36363c;
            color: #ffffff;
        }

        .auth-option.email,
        .auth-option.guest {
            background: rgba(255, 255, 255, 0.04);
            color: #e8e8ec;
        }

        .auth-option:last-of-type {
            margin-bottom: 0;
        }

        /* ---------- Google account chooser ---------- */
        .google-head {
            text-align: left;
            margin-bottom: 20px;
        }

        .google-mark {
            width: 26px;
            height: 26px;
            margin-bottom: 16px;
        }

        .google-head h2 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .google-head p {
            margin-top: 8px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .google-account {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px 4px;
            background: transparent;
            border: none;
            border-top: 1px solid var(--panel-border);
            color: var(--text);
            font-family: inherit;
            text-align: left;
            cursor: pointer;
        }

        .google-account:last-of-type {
            border-bottom: 1px solid var(--panel-border);
        }

        .google-account:hover .g-name {
            color: var(--accent);
        }

        .g-avatar {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--accent), rgba(var(--accent-rgb), 0.55));
            color: #0a0a0b;
            font-size: 15px;
            font-weight: 800;
        }

        .g-avatar.icon {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--panel-border);
        }

        .g-avatar.icon svg {
            width: 18px;
            height: 18px;
        }

        .g-text {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .g-name {
            color: #ffffff;
            font-size: 14.5px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .g-mail {
            color: var(--muted);
            font-size: 12.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ---------- Email & password ---------- */
        .auth-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 18px;
            padding: 4px;
            background: #0d0d0f;
            border: 1px solid var(--panel-border);
            border-radius: 14px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .auth-tab.active {
            background: var(--accent);
            color: #0a0a0b;
            font-weight: 700;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .auth-form.active {
            display: flex;
        }

        .auth-input {
            width: 100%;
            padding: 13px 15px;
            background: #0b0b0d;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            color: #ffffff;
            font-family: inherit;
            font-size: 14.5px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-input::placeholder {
            color: #5e5e66;
        }

        .auth-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18);
        }

        .auth-submit {
            width: 100%;
            margin-top: 4px;
            padding: 13px;
            background: var(--accent);
            color: #0a0a0b;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(var(--accent-rgb), 0.24);
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .auth-submit:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .auth-error {
            min-height: 18px;
            margin: 2px 0;
            color: #ff6b6b;
            font-size: 12.5px;
            text-align: center;
        }

        .auth-error.ok {
            color: var(--accent);
        }

        .auth-forgot {
            align-self: flex-end;
            margin: 0 4px 2px;
            padding: 0;
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .auth-forgot:hover {
            color: var(--accent);
        }

        .auth-option:disabled,
        .auth-submit:disabled,
        .auth-forgot:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .auth-note {
            max-width: 440px;
            margin-top: 14px;
            color: var(--muted);
            font-size: 11.5px;
            line-height: 1.6;
            text-align: center;
        }

        .auth-note strong {
            color: var(--accent);
            font-weight: 600;
        }

        .auth-note.demo {
            color: #c4ae72;
        }

        /* ---------- Back + footer ---------- */
        .auth-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            padding: 0;
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: inherit;
            font-size: 12.5px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .auth-back:hover {
            color: var(--accent);
        }

        .auth-foot {
            margin-top: 20px;
            color: var(--muted);
            font-size: 11.5px;
            text-align: center;
            line-height: 1.6;
        }

        .auth-foot a {
            color: var(--muted);
            text-decoration: none;
        }

        .auth-foot a:hover {
            color: var(--accent);
        }

        @media (max-width: 480px) {
            body { padding: 24px 12px; }
            .auth-shell { min-height: calc(100vh - 48px); }
            .auth-brand { margin-bottom: 20px; }
            .auth-logo { width: 58px; height: 58px; margin-bottom: 12px; }
            .auth-logo img { width: 40px; height: 40px; }
            .auth-wordmark { font-size: 1.12rem; letter-spacing: 0.09em; }
            .auth-card { padding: 22px; border-radius: 24px; }
            .auth-option { font-size: 14px; padding: 14px 16px; }
        }

        @media (max-width: 360px) {
            .auth-wordmark { font-size: 0.98rem; letter-spacing: 0.06em; }
            .auth-card { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-brand">
            <div class="auth-logo">
                <img src="logo.svg" alt="Bliss Bloom Events Logo">
            </div>
            <h1 class="auth-wordmark">BLISS BLOOM <span>EVENTS</span></h1>
            <p class="auth-tagline">Where Elegance Meets Celebration</p>
        </div>

        <div class="auth-card">
            <!-- Step 1: sign-in options -->
            <section id="view-options" class="auth-view active">
                <button class="auth-option google" type="button" onclick="googleLogin()">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.3 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
                        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41.4 35.6 44 30.3 44 24c0-1.3-.1-2.4-.4-3.5z"/>
                    </svg>
                    Sign in with Google
                </button>

                <button class="auth-option email" type="button" onclick="showView('email')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="m3 7 9 6 9-6"/>
                    </svg>
                    Email &amp; Password
                </button>

                <button class="auth-option guest" type="button" onclick="guestLogin()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 21a8 8 0 0 1 16 0"/>
                    </svg>
                    Guest Mode
                </button>
                <p class="auth-error" id="optionsError"></p>
            </section>

            <!-- Step 2: Google account chooser -->
            <section id="view-google" class="auth-view">
                <div class="google-head">
                    <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.3 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
                        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41.4 35.6 44 30.3 44 24c0-1.3-.1-2.4-.4-3.5z"/>
                    </svg>
                    <h2>Choose an account</h2>
                    <p>to continue to Bliss Bloom Events</p>
                </div>

                <button class="google-account" type="button" onclick="chooseGoogleAccount()">
                    <span class="g-avatar" id="chooserInitial">S</span>
                    <span class="g-text">
                        <span class="g-name" id="chooserName">Sharath</span>
                        <span class="g-mail" id="chooserEmail">sharathbaireddy8045@gmail.com</span>
                    </span>
                </button>

                <button class="google-account" type="button" onclick="showView('email')">
                    <span class="g-avatar icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 21a8 8 0 0 1 16 0"/>
                        </svg>
                    </span>
                    <span class="g-text">
                        <span class="g-name">Use another account</span>
                    </span>
                </button>

                <button class="auth-back" type="button" onclick="showView('options')">
                    <span aria-hidden="true">&larr;</span> Back
                </button>
            </section>

            <!-- Step 3: email & password -->
            <section id="view-email" class="auth-view">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tabLogin" type="button" onclick="showAuth('login')">Login</button>
                    <button class="auth-tab" id="tabSignup" type="button" onclick="showAuth('signup')">Sign Up</button>
                </div>

                <form id="loginForm" class="auth-form active" onsubmit="handleAuth(event, 'login')">
                    <input type="email" id="loginEmail" class="auth-input" placeholder="Email" autocomplete="email" required>
                    <input type="password" id="loginPassword" class="auth-input" placeholder="Password" autocomplete="current-password" required>
                    <button class="auth-forgot" type="button" onclick="forgotPassword()">Forgot password?</button>
                    <p class="auth-error" id="authError"></p>
                    <button type="submit" class="auth-submit">Login with Email</button>
                </form>

                <form id="signupForm" class="auth-form" onsubmit="handleAuth(event, 'signup')">
                    <input type="text" id="signupName" class="auth-input" placeholder="Full Name" autocomplete="name" required>
                    <input type="email" id="signupEmail" class="auth-input" placeholder="Email" autocomplete="email" required>
                    <input type="password" id="signupPassword" class="auth-input" placeholder="Password" autocomplete="new-password" required>
                    <p class="auth-error" id="signupError"></p>
                    <button type="submit" class="auth-submit">Sign Up with Email</button>
                </form>

                <button class="auth-back" type="button" onclick="showView('options')">
                    <span aria-hidden="true">&larr;</span> Back
                </button>
            </section>
        </div>

        <p class="auth-foot">
            By continuing you agree to our
            <a href="#" onclick="return false;">Terms of Service</a> and
            <a href="#" onclick="return false;">Privacy Policy</a>.
        </p>

        <p class="auth-note" id="authNote" hidden></p>
    </div>

    <script>
        var DEFAULT_ACCOUNT = {
            name: 'Sharath',
            email: 'sharathbaireddy8045@gmail.com'
        };

        function isFirebase() {
            return !!(window.BlissAuth && window.BlissAuth.isConfigured);
        }

        function showView(name) {
            document.querySelectorAll('.auth-view').forEach(function (v) {
                v.classList.remove('active');
            });
            var view = document.getElementById('view-' + name);
            if (view) view.classList.add('active');
            ['authError', 'signupError', 'optionsError'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) {
                    el.textContent = '';
                    el.classList.remove('ok');
                }
            });
        }

        function showAuth(type) {
            document.getElementById('tabLogin').classList.toggle('active', type === 'login');
            document.getElementById('tabSignup').classList.toggle('active', type === 'signup');
            document.getElementById('loginForm').classList.toggle('active', type === 'login');
            document.getElementById('signupForm').classList.toggle('active', type === 'signup');
            ['authError', 'signupError'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) {
                    el.textContent = '';
                    el.classList.remove('ok');
                }
            });
        }

        function setOptionsError(message) {
            var el = document.getElementById('optionsError');
            if (!el) return;
            el.textContent = message || '';
            el.classList.remove('ok');
        }

        function setFormError(id, message, ok) {
            var el = document.getElementById(id);
            if (!el) return;
            el.textContent = message || '';
            el.classList.toggle('ok', !!ok);
        }

        function lockButtons(lock) {
            document.querySelectorAll('.auth-option, .auth-submit, .auth-forgot').forEach(function (button) {
                button.disabled = lock;
            });
        }

        /* ---------- Local demo mode (used until Firebase keys are added) ---------- */
        function getAccounts() {
            try {
                var list = JSON.parse(localStorage.getItem('blissAccounts') || '[]');
                return Array.isArray(list) ? list : [];
            } catch (e) {
                return [];
            }
        }

        function saveAccounts(list) {
            try { localStorage.setItem('blissAccounts', JSON.stringify(list)); } catch (e) {}
        }

        function finishDemoLogin(user) {
            try { localStorage.setItem('blissUser', JSON.stringify(user)); } catch (e) {}
            window.location.href = 'web.html';
        }

        function chooseGoogleAccount() {
            var accounts = getAccounts();
            var acc = accounts[0] || DEFAULT_ACCOUNT;
            finishDemoLogin({
                provider: 'google',
                type: 'social',
                name: acc.name || DEFAULT_ACCOUNT.name,
                email: acc.email || DEFAULT_ACCOUNT.email
            });
        }

        function demoHandleAuth(type) {
            if (type === 'login') {
                var email = document.getElementById('loginEmail').value.trim();
                var password = document.getElementById('loginPassword').value;
                var accounts = getAccounts();
                var match = accounts.filter(function (a) {
                    return a.email && a.email.toLowerCase() === email.toLowerCase() && a.password === password;
                })[0];

                if (accounts.length && !match) {
                    setFormError('authError', 'Email or password is incorrect. Please sign up first.');
                    return;
                }

                finishDemoLogin({
                    email: email,
                    type: 'login',
                    name: match ? match.name : email.split('@')[0]
                });
                return;
            }

            var name = document.getElementById('signupName').value.trim();
            var newEmail = document.getElementById('signupEmail').value.trim();
            var newPassword = document.getElementById('signupPassword').value;

            if (newPassword.length < 4) {
                setFormError('signupError', 'Password must be at least 4 characters.');
                return;
            }

            var list = getAccounts();
            var exists = list.some(function (a) {
                return a.email && a.email.toLowerCase() === newEmail.toLowerCase();
            });
            if (exists) {
                setFormError('signupError', 'An account with this email already exists. Please log in.');
                return;
            }

            list.push({ name: name, email: newEmail, password: newPassword });
            saveAccounts(list);

            finishDemoLogin({ email: newEmail, type: 'signup', name: name });
        }

        /* ---------- Real Firebase Authentication ---------- */
        function finishFirebaseLogin(fbUser) {
            var provider = fbUser.providerData && fbUser.providerData[0]
                ? fbUser.providerData[0].providerId
                : (fbUser.isAnonymous ? 'anonymous' : 'password');

            var user = {
                uid: fbUser.uid,
                provider: provider,
                type: fbUser.isAnonymous ? 'guest' : 'firebase',
                name: fbUser.displayName || (fbUser.email ? fbUser.email.split('@')[0] : 'Guest User'),
                email: fbUser.email || '',
                photoURL: fbUser.photoURL || ''
            };

            try { localStorage.setItem('blissUser', JSON.stringify(user)); } catch (e) {}
            window.location.href = 'web.html';
        }

        async function googleLogin() {
            if (!isFirebase()) {
                showView('google');
                return;
            }
            setOptionsError('');
            lockButtons(true);
            try {
                var user = await window.BlissAuth.google();
                if (user) finishFirebaseLogin(user);
            } catch (err) {
                setOptionsError(err.message || 'Google sign-in failed.');
            } finally {
                lockButtons(false);
            }
        }

        async function guestLogin() {
            if (!isFirebase()) {
                finishDemoLogin({ type: 'guest', name: 'Guest User' });
                return;
            }
            setOptionsError('');
            lockButtons(true);
            try {
                var user = await window.BlissAuth.guest();
                if (user) finishFirebaseLogin(user);
            } catch (err) {
                setOptionsError(err.message || 'Guest sign-in failed.');
            } finally {
                lockButtons(false);
            }
        }

        async function handleAuth(e, type) {
            e.preventDefault();

            if (!isFirebase()) {
                demoHandleAuth(type);
                return;
            }

            var isLogin = type === 'login';
            var errorId = isLogin ? 'authError' : 'signupError';
            var email = document.getElementById(isLogin ? 'loginEmail' : 'signupEmail').value.trim();
            var password = document.getElementById(isLogin ? 'loginPassword' : 'signupPassword').value;
            var name = isLogin ? '' : document.getElementById('signupName').value.trim();

            setFormError(errorId, '');

            if (!isLogin && password.length < 6) {
                setFormError(errorId, 'Password must be at least 6 characters.');
                return;
            }

            lockButtons(true);
            try {
                var user = isLogin
                    ? await window.BlissAuth.emailLogin(email, password)
                    : await window.BlissAuth.emailSignup(name, email, password);
                if (user) finishFirebaseLogin(user);
            } catch (err) {
                setFormError(errorId, err.message || 'Sign-in failed.');
            } finally {
                lockButtons(false);
            }
        }

        async function forgotPassword() {
            var email = document.getElementById('loginEmail').value.trim();

            if (!email) {
                setFormError('authError', 'Enter your email address first.');
                return;
            }

            if (!isFirebase()) {
                setFormError('authError', 'Add your Firebase keys in firebase-config.js to enable password reset.');
                return;
            }

            lockButtons(true);
            try {
                await window.BlissAuth.resetPassword(email);
                setFormError('authError', 'Password reset email sent.', true);
            } catch (err) {
                setFormError('authError', err.message || 'Could not send the reset email.');
            } finally {
                lockButtons(false);
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            var accounts = getAccounts();
            var acc = accounts[0] || DEFAULT_ACCOUNT;
            var displayName = acc.name || DEFAULT_ACCOUNT.name;
            var displayEmail = acc.email || DEFAULT_ACCOUNT.email;

            var nameEl = document.getElementById('chooserName');
            var emailEl = document.getElementById('chooserEmail');
            var initialEl = document.getElementById('chooserInitial');

            if (nameEl) nameEl.textContent = displayName;
            if (emailEl) emailEl.textContent = displayEmail;
            if (initialEl) initialEl.textContent = (displayName.charAt(0) || 'S').toUpperCase();

            var note = document.getElementById('authNote');
            if (!note) return;

            note.hidden = false;

            if (window.BlissAuth && window.BlissAuth.configError) {
                note.classList.add('demo');
                note.textContent = 'Firebase could not start: ' + window.BlissAuth.configError;
            } else if (isFirebase()) {
                note.innerHTML = 'Secure sign-in powered by <strong>Firebase</strong>';
            } else {
                note.classList.add('demo');
                note.innerHTML = 'Demo mode \u2014 add your Firebase keys in <strong>firebase-config.js</strong> to enable real Google sign-in.';
            }
        });
    </script>
</body>
</html>
