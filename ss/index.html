<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliss Bloom Events</title>
    <link rel="stylesheet" href="web.css">
    <style>
        .start-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; background: radial-gradient(ellipse at center, #1a1500 0%, #000000 70%); }
        .logo { width:180px; height:auto; margin-bottom:30px; filter: drop-shadow(0 0 20px rgba(255,215,0,0.5)); }
        .start-title { color:#FFD700; font-size:28px; margin-bottom:10px; letter-spacing:3px; font-family: Georgia, serif; }
        .start-subtitle { color:#ccc; margin-bottom:40px; font-size:18px; }
        .auth-container { background:rgba(0,0,0,0.9); padding:40px; border-radius:15px; box-shadow:0 0 25px rgba(255,215,0,0.4); max-width:400px; width:90%; border:1px solid rgba(255,215,0,0.3); }
        .auth-tabs { display:flex; gap:10px; margin-bottom:30px; }
        .auth-tab { flex:1; padding:10px; background:rgba(255,215,0,0.1); color:#FFD700; border:2px solid #FFD700; border-radius:8px; cursor:pointer; transition:0.3s; }
        .auth-tab.active { background:#FFD700; color:#000; font-weight:bold; }
        .auth-form { display:none; flex-direction:column; gap:15px; }
        .auth-form.active { display:flex; }
        .auth-input { padding:12px; background:rgba(30,30,30,0.8); border:2px solid #FFD700; border-radius:8px; color:#fff; font-size:16px; }
        .social-btn { padding:12px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; display:flex; align-items:center; justify-content:center; gap:10px; }
        .google-btn { background:#fff; color:#000; }
        .apple-btn { background:#000; color:#fff; border:1px solid #fff; }
        .email-btn { background:#FFD700; color:#000; }
        .guest-btn { background:rgba(255,255,255,0.1); color:#FFD700; border:2px solid #FFD700; }
        .divider { color:#ccc; margin:10px 0; }
    </style>
</head>
<body>
    <div class="start-screen">
        <img src="logo.svg" alt="Bliss Bloom Events Logo" class="logo">
        <h1 class="start-title">BLISS BLOOM EVENTS</h1>
        <p class="start-subtitle">Where Elegance Meets Celebration</p>
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="showAuth('login')">Login</button>
                <button class="auth-tab" onclick="showAuth('signup')">Sign Up</button>
            </div>
            <form id="loginForm" class="auth-form active">
                <input type="email" id="loginEmail" class="auth-input" placeholder="Email" required>
                <input type="password" id="loginPassword" class="auth-input" placeholder="Password" required>
                <button type="submit" class="social-btn email-btn">Login with Email</button>
                <div class="divider">OR</div>
                <button type="button" class="social-btn google-btn" onclick="socialLogin('google')">🔍 Continue with Google</button>
                <button type="button" class="social-btn apple-btn" onclick="socialLogin('apple')">🍎 Continue with Apple</button>
                <button type="button" class="social-btn guest-btn" onclick="guestLogin()">👤 Continue as Guest</button>
            </form>
            <form id="signupForm" class="auth-form">
                <input type="text" id="signupName" class="auth-input" placeholder="Full Name" required>
                <input type="email" id="signupEmail" class="auth-input" placeholder="Email" required>
                <input type="password" id="signupPassword" class="auth-input" placeholder="Password" required>
                <button type="submit" class="social-btn email-btn">Sign Up with Email</button>
                <div class="divider">OR</div>
                <button type="button" class="social-btn google-btn" onclick="socialLogin('google')">🔍 Continue with Google</button>
                <button type="button" class="social-btn apple-btn" onclick="socialLogin('apple')">🍎 Continue with Apple</button>
                <button type="button" class="social-btn guest-btn" onclick="guestLogin()">👤 Continue as Guest</button>
            </form>
        </div>
    </div>
    <script>
        function showAuth(type) {
            document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f=>f.classList.remove('active'));
            if(type==='login') { document.querySelectorAll('.auth-tab')[0].classList.add('active'); document.getElementById('loginForm').classList.add('active'); }
            else { document.querySelectorAll('.auth-tab')[1].classList.add('active'); document.getElementById('signupForm').classList.add('active'); }
        }
        document.getElementById('loginForm').addEventListener('submit', function(e){ e.preventDefault(); localStorage.setItem('user', JSON.stringify({email:document.getElementById('loginEmail').value, type:'email'})); window.location.href='web.html'; });
        document.getElementById('signupForm').addEventListener('submit', function(e){ e.preventDefault(); localStorage.setItem('user', JSON.stringify({name:document.getElementById('signupName').value, email:document.getElementById('signupEmail').value, type:'email'})); window.location.href='web.html'; });
        function socialLogin(provider){ localStorage.setItem('user', JSON.stringify({provider, type:'social'})); window.location.href='web.html'; }
        function guestLogin(){ localStorage.setItem('user', JSON.stringify({type:'guest'})); window.location.href='web.html'; }
    </script>
</body>
</html>
