<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Bliss Bloom Events - Welcome</title>
    <script src="theme.js?v=3"></script>
    <style>
        :root {
            --accent: #e8c96a;
            --accent-rgb: 232, 201, 106;
            --page-bg: #0b0a07;
            --text: #f5f1e6;
            --muted: #9c9583;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 18px;
            background-color: var(--page-bg);
            background-image:
                radial-gradient(circle at 50% -6%, rgba(var(--accent-rgb), 0.22), transparent 46%),
                radial-gradient(circle at 15% 92%, rgba(var(--accent-rgb), 0.09), transparent 42%),
                radial-gradient(circle at 92% 18%, rgba(var(--accent-rgb), 0.05), transparent 34%);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }

        .splash-container {
            position: relative;
            text-align: center;
            animation: fadeInUp 1.1s ease-out both;
        }

        .logo-ring {
            width: 132px;
            height: 132px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(var(--accent-rgb), 0.55);
            border-radius: 50%;
            background: radial-gradient(circle at 50% 28%, rgba(var(--accent-rgb), 0.18), rgba(var(--accent-rgb), 0.02) 72%);
            box-shadow:
                0 0 0 8px rgba(var(--accent-rgb), 0.05),
                0 0 66px rgba(var(--accent-rgb), 0.32),
                inset 0 0 30px rgba(var(--accent-rgb), 0.10);
            animation: pulse 3s ease-in-out infinite;
        }

        .logo-ring img {
            width: 86px;
            height: 86px;
            display: block;
            filter: drop-shadow(0 0 18px rgba(var(--accent-rgb), 0.55));
        }

        .brand-name {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(1.7rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: 0.16em;
            line-height: 1.15;
            text-transform: uppercase;
            white-space: nowrap;
            background: linear-gradient(100deg, #f8e9bb 0%, #e8c96a 30%, #b8912f 52%, #f3dfa0 76%, #caa64c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 18px rgba(var(--accent-rgb), 0.30));
        }

        .brand-name span {
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }

        .tagline {
            margin: 16px 0 44px;
            color: #b3a888;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .enter-btn {
            padding: 15px 58px;
            background: var(--accent);
            color: #0a0a0b;
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.22em;
            cursor: pointer;
            box-shadow: 0 14px 38px rgba(var(--accent-rgb), 0.34);
            transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
        }

        .enter-btn:hover {
            transform: translateY(-2px) scale(1.03);
            filter: brightness(1.08);
            box-shadow: 0 20px 48px rgba(var(--accent-rgb), 0.46);
        }

        .enter-btn:active {
            transform: translateY(0) scale(0.99);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(var(--accent-rgb), 0.28), inset 0 0 30px rgba(var(--accent-rgb), 0.08); }
            50% { transform: scale(1.04); box-shadow: 0 0 80px rgba(var(--accent-rgb), 0.38), inset 0 0 36px rgba(var(--accent-rgb), 0.12); }
        }

        @media (max-width: 480px) {
            .logo-ring { width: 104px; height: 104px; margin-bottom: 22px; }
            .logo-ring img { width: 68px; height: 68px; }
            .brand-name { font-size: clamp(1.35rem, 7vw, 1.9rem); letter-spacing: 0.1em; }
            .tagline { margin-bottom: 34px; }
            .enter-btn { padding: 14px 46px; letter-spacing: 0.18em; }
        }

        @media (max-width: 360px) {
            .brand-name { font-size: 1.2rem; letter-spacing: 0.07em; }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-ring">
            <img src="logo.svg" alt="Bliss Bloom Events">
        </div>
        <h1 class="brand-name">BLISS BLOOM <span>EVENTS</span></h1>
        <p class="tagline">Where Elegance Meets Celebration</p>
        <button class="enter-btn" onclick="window.location.href='index.html'">ENTER</button>
    </div>
</body>
</html>
