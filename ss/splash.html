<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliss Bloom Events - Welcome</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: url("images/roman-marble.jpeg") center center/cover no-repeat fixed; min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; }
        body::before { content:""; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.65); z-index:0; }
        .splash-container { position:relative; z-index:1; text-align:center; animation: fadeInUp 1.5s ease-out; }
        .logo { width:250px; height:auto; margin-bottom:25px; filter: drop-shadow(0 0 40px rgba(255,215,0,0.8)); animation: pulse 2.5s ease-in-out infinite; }
        .brand-name { color:#FFD700; font-size:48px; font-family: Georgia, serif; letter-spacing:6px; font-weight:bold; text-shadow:3px 3px 6px rgba(0,0,0,0.9); margin-bottom:12px; }
        .tagline { color:#f5f5f5; font-size:22px; font-style:italic; margin-bottom:60px; text-shadow:2px 2px 4px rgba(0,0,0,0.9); }
        .enter-btn { padding:16px 60px; background:linear-gradient(135deg, #FFD700, #B8860B); color:#000; border:none; border-radius:50px; font-size:19px; font-weight:bold; cursor:pointer; transition:0.3s; box-shadow:0 12px 35px rgba(255,215,0,0.5); letter-spacing:3px; }
        .enter-btn:hover { transform:scale(1.12); box-shadow:0 18px 45px rgba(255,215,0,0.7); }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
        @keyframes pulse { 0%, 100% { transform:scale(1); } 50% { transform:scale(1.06); } }
    </style>
</head>
<body>
    <div class="splash-container">
        <img src="logo.svg" alt="Bliss Bloom Events" class="logo">
        <h1 class="brand-name">BLISS BLOOM EVENTS</h1>
        <p class="tagline">Where Elegance Meets Celebration</p>
        <button class="enter-btn" onclick="window.location.href='index.html'">ENTER</button>
    </div>
</body>
</html>
